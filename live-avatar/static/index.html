<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Live Avatar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
  <script type="importmap">
  { "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js/+esm",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
      "talkinghead": "https://cdn.jsdelivr.net/gh/met4citizen/TalkingHead@1.7/modules/talkinghead.mjs"
  } }
  </script>
</head>
<body>
  <main class="stage">
    <div id="avatar" class="avatar"></div>

    <div class="loading" id="loading">
      <div class="spinner"></div>
      <p id="loading-text">Loading avatar…</p>
    </div>

    <header class="topbar">
      <div class="brand">
        <span class="brand-dot"></span>
        <span id="avatar-name">Claude</span>
      </div>
      <div class="status" id="status" data-phase="idle">
        <span class="status-ring" id="mic-ring"></span>
        <span id="status-text">Ready</span>
      </div>
    </header>

    <section class="captions" aria-live="polite">
      <p class="caption-user" id="caption-user"></p>
      <p class="caption-assistant" id="caption-assistant"></p>
    </section>

    <footer class="controls">
      <button id="btn-mute" class="icon-btn" title="Mute microphone (M)" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 1 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2Z"/></svg>
      </button>
      <button id="btn-stop" class="icon-btn" title="Stop speaking (Esc)" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
      </button>
    </footer>

    <div class="start" id="start">
      <div class="start-card">
        <h1>Talk with Claude</h1>
        <p>Just speak naturally. Claude listens continuously, knows when you've finished, and answers out loud. You can interrupt at any time.</p>
        <button id="btn-start" class="primary" disabled>Start conversation</button>
        <p class="hint">Use Chrome or Edge. Headphones give the best experience.</p>
        <p class="error" id="start-error" hidden></p>
      </div>
    </div>
  </main>

  <script type="module" src="/static/app.js"></script>
</body>
</html>
